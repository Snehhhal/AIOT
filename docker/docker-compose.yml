version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pole_safety_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-electric_pole_safety_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: pole_safety_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - POSTGRES_SERVER=postgres
      - SIMULATION_MODE=true
    volumes:
      - ../backend:/app/backend
      - ../ai:/app/ai
      - ../rag:/app/rag

volumes:
  postgres_data:
