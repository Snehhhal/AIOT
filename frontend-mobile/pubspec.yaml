name: pole_safety_mobile
description: "AI & IoT Based Electric Pole Leakage Detection and Life Safety Mobile Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  web_socket_channel: ^3.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  flutter_local_notifications: ^17.1.2
  camera: ^0.11.0
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  provider: ^6.1.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
